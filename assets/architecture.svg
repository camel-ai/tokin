<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" role="img" aria-label="The harness sends messages to tokin and gets back text and tool calls. tokin sends input_ids to the inference server and gets back output_ids and logprobs.">
  <!-- Everything sits on an explicit light panel so the figure reads identically
       on light and dark README backgrounds. -->
  <rect x="8" y="8" width="864" height="224" rx="14" fill="#fcfcfd" stroke="#e8eaee" stroke-width="1"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif">
    <!-- Harness -->
    <rect x="40" y="76" width="196" height="88" rx="11" fill="#ffffff" stroke="#dde1e7" stroke-width="1.5"/>
    <text x="138" y="115" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Harness</text>
    <text x="138" y="137" text-anchor="middle" font-size="12" fill="#7b8494">unmodified</text>

    <!-- tokin — filled, because it is the subject rather than context -->
    <rect x="342" y="76" width="196" height="88" rx="11" fill="#0f172a"/>
    <text x="440" y="115" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="-0.2">tokin</text>
    <text x="440" y="137" text-anchor="middle" font-size="12" fill="#98a2b3">token fidelity</text>

    <!-- Inference Server -->
    <rect x="644" y="76" width="196" height="88" rx="11" fill="#ffffff" stroke="#dde1e7" stroke-width="1.5"/>
    <text x="742" y="115" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Inference Server</text>
    <text x="742" y="137" text-anchor="middle" font-size="12" fill="#7b8494">SGLang · vLLM</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
      <!-- harness → tokin -->
      <text x="289" y="98" text-anchor="middle" fill="#7c3aed">messages</text>
      <line x1="244" y1="108" x2="334" y2="108" stroke="#7c3aed" stroke-width="1.75" marker-end="url(#v)"/>

      <!-- tokin → harness -->
      <line x1="334" y1="136" x2="244" y2="136" stroke="#7c3aed" stroke-width="1.75" marker-end="url(#v)"/>
      <text x="289" y="152" text-anchor="middle" fill="#7c3aed">text</text>
      <text x="289" y="167" text-anchor="middle" fill="#7c3aed">tool calls</text>

      <!-- tokin → server -->
      <text x="591" y="98" text-anchor="middle" fill="#0d9488">input_ids</text>
      <line x1="546" y1="108" x2="636" y2="108" stroke="#0d9488" stroke-width="1.75" marker-end="url(#t)"/>

      <!-- server → tokin -->
      <line x1="636" y1="136" x2="546" y2="136" stroke="#0d9488" stroke-width="1.75" marker-end="url(#t)"/>
      <text x="591" y="152" text-anchor="middle" fill="#0d9488">output_ids</text>
      <text x="591" y="167" text-anchor="middle" fill="#0d9488">logprobs</text>
    </g>

    <!-- what each side of tokin is made of -->
    <text x="289" y="203" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7c3aed" letter-spacing="0.02em">TEXT IN, TEXT OUT</text>
    <text x="591" y="203" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0d9488" letter-spacing="0.02em">TOKEN IN, TOKEN OUT</text>
  </g>

  <defs>
    <marker id="v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#7c3aed"/>
    </marker>
    <marker id="t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#0d9488"/>
    </marker>
  </defs>
</svg>
